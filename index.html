<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AISpeak — interactive prototype</title>
<meta name="description" content="Interactive prototype of AISpeak, an AI-powered English learning app. Concept and design by Aleksandra Novikova.">
<meta name="theme-color" content="#160E26">
<link rel="icon" href="assets/blob-a.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0817}
a{color:#BDF288}a:hover{color:#d6f9b3}
.ais,.ais *{box-sizing:border-box}
.ais{--bg:#160E26;--card:#2C243C;--card-a:rgba(44,36,60,.92);--field:#231B33;--text:#FFFFFF;--text-soft:#E4E2E8;--muted:#A7A4AD;--accent-text:#BDF288;--bar-soft:rgba(189,242,136,.35);--line:rgba(255,255,255,.12);--line-strong:rgba(255,255,255,.2);--chip:rgba(255,255,255,.06);--nav:#241C36;--scrim:rgba(22,14,38,.72);--danger:#FF8A80}
.ais.light{--bg:#F5F2FA;--card:#FFFFFF;--card-a:rgba(255,255,255,.94);--field:#FFFFFF;--text:#160E26;--text-soft:#3A3349;--muted:#625C70;--accent-text:#2B1A4D;--bar-soft:rgba(43,26,77,.18);--line:rgba(22,14,38,.12);--line-strong:rgba(22,14,38,.22);--chip:rgba(22,14,38,.05);--nav:#FFFFFF;--scrim:rgba(22,14,38,.35);--danger:#B3261E}
.ais.light img[style*="pointer-events: none"]{opacity:.3 !important}
.ais.light [style*="background: var(--card)"],.ais.light [style*="background: var(--card-a)"]{box-shadow:0 2px 14px rgba(22,14,38,.07)}
.nav-shape{filter:drop-shadow(0 -8px 18px rgba(0,0,0,.28))}
.ais.light .nav-shape{filter:drop-shadow(0 -6px 16px rgba(22,14,38,.1))}
.ais button{font-family:inherit;cursor:pointer}
.ais input{font-family:inherit}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.btn-primary{background:#BDF288;color:#160E26;border:0;border-radius:999px;height:48px;padding:0 40px;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;transition:transform .15s ease,opacity .2s ease,box-shadow .2s ease;box-shadow:0 8px 24px rgba(189,242,136,.18)}
.btn-primary:hover{box-shadow:0 10px 30px rgba(189,242,136,.32)}
.btn-primary:active{transform:scale(.96)}
.btn-primary:disabled{opacity:.3;cursor:default;box-shadow:none}
.btn-ghost{background:var(--card-a);color:var(--text);border:1px solid rgba(140,190,70,.7);border-radius:12px;min-height:46px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;transition:border-color .2s,background .2s}
.btn-ghost:hover{border-color:#BDF288;background:var(--card)}
.link{background:none;border:0;color:var(--accent-text);font-weight:700;padding:0;font-size:inherit}
.icon-btn{background:none;border:0;color:var(--text);width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;padding:0}
.icon-btn:hover{background:var(--chip)}
.w{background:none;border:0;padding:0;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;font:inherit;cursor:pointer}
.w:hover{text-decoration-thickness:2px}
.field{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:15px;padding:0 16px;outline:none;transition:border-color .2s}
.field:focus{border-color:#BDF288}
.card-btn{background:none;border:0;padding:0;text-align:left;color:var(--text);width:100%;display:block}
.card-btn img{transition:transform .4s ease}
.card-btn:hover img{transform:scale(1.04)}
.nav-btn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:600;min-width:64px;min-height:48px;justify-content:center;padding:0}
.blobs img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.blobs{animation:float 6s ease-in-out infinite}
.blobs img:nth-child(1){animation:blobfade 9s ease-in-out infinite}
.blobs img:nth-child(2){animation:blobfade 9s ease-in-out -3s infinite}
.blobs img:nth-child(3){animation:blobfade 9s ease-in-out -6s infinite}
.talking{animation:pulse 1.1s ease-in-out infinite}
.mic-on{animation:ring 1.2s ease-out infinite}
.fade{animation:fadeUp .4s ease both}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent-text);animation:dot 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
.bars span{display:inline-block;width:3px;margin:0 1px;border-radius:2px;background:var(--accent-text);animation:bar .9s ease-in-out infinite}
.bars span:nth-child(2){animation-delay:.15s}.bars span:nth-child(3){animation-delay:.3s}.bars span:nth-child(4){animation-delay:.45s}
@keyframes blobfade{0%,28%{opacity:1}38%,90%{opacity:0}100%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(5deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(189,242,136,.6)}100%{box-shadow:0 0 0 24px rgba(189,242,136,0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes bar{0%,100%{height:4px}50%{height:16px}}
@keyframes prog{from{width:6%}to{width:100%}}
</style>
<style>
html,body{height:100%}
body{margin:0;background:#0d0817;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#phone{width:390px;height:844px;flex-shrink:0;transform-origin:center center;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
body.fit-mobile{background:#160E26}
body.fit-mobile #phone{border-radius:0;box-shadow:none}
</style>
</head>
<body>
<div id="stage"><div id="phone"></div></div>
<template id="dc-tpl">
<div class="{{rootClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--text); transition: background .3s, color .3s; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">

<!-- ============ SPLASH ============ -->
<sc-if value="{{isSplash}}" hint-placeholder-val="{{ true }}">
<div class="fade" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 72px 32px 56px">
<img src="assets/glow-1.webp" alt="" aria-hidden="true" style="position: absolute; right: -260px; bottom: -200px; width: 560px; opacity: 0.45; pointer-events: none">
<div style="position: relative; height: 64px; display: flex; align-items: center; isolation: isolate">
<div style="position: absolute; left: -6px; width: 64px; height: 64px; border-radius: 50%; background: #BDF288"></div>
<span style="position: relative; font-weight: 800; font-size: 34px; letter-spacing: -0.07em; color: #bdf288; mix-blend-mode: difference">AISpeak</span>
</div>
<div class="blobs" style="position: relative; width: 190px; height: 230px; margin-top: 64px">
<img src="assets/blob-a.webp" alt="" aria-hidden="true">
<img src="assets/blob-b.webp" alt="" aria-hidden="true">
<img src="assets/blob-c.webp" alt="" aria-hidden="true">
</div>
<h1 style="margin: 48px 0 0; font-size: 26px; font-weight: 700; text-align: center; line-height: 1.25">Hi, nice to meet you</h1>
<p style="margin: 12px 0 0; font-size: 15px; color: var(--muted); text-align: center; line-height: 1.5">Speak with confidence,<br>powered by AI</p>
<div style="flex-grow: 1"></div>
<button class="btn-primary" onClick="{{goRegister}}">Start</button>
<p style="margin: 20px 0 0; font-size: 13px; color: var(--muted)">Already have an account? <button class="link" onClick="{{goSignin}}">Sign In</button></p>
</div>
</sc-if>

<!-- ============ REGISTER / SIGN IN ============ -->
<sc-if value="{{isAuth}}" hint-placeholder-val="{{ false }}">
<div class="fade" style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: 56px 28px 48px">
<img src="assets/glow-2.webp" alt="" aria-hidden="true" style="position: absolute; left: -300px; top: -260px; width: 520px; opacity: 0.35; pointer-events: none">
<button class="icon-btn" aria-label="Back" onClick="{{goSplash}}" style="margin-left: -10px; position: relative">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>
<div style="position: relative; height: 56px; display: flex; align-items: center; isolation: isolate; margin-top: 16px; align-self: center">
<div style="position: absolute; left: -6px; width: 56px; height: 56px; border-radius: 50%; background: #BDF288"></div>
<span style="position: relative; font-weight: 800; font-size: 30px; letter-spacing: -0.07em; color: #bdf288; mix-blend-mode: difference">AISpeak</span>
</div>
<h1 style="margin: 36px 0 28px; font-size: 26px; font-weight: 700; text-align: center">{{authTitle}}</h1>
<div style="display: flex; flex-direction: column; gap: 16px; position: relative">
<sc-if value="{{isRegister}}" hint-placeholder-val="{{ true }}">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted)">Your name
<input class="field" type="text" value="{{name}}" onChange="{{onName}}" autocomplete="given-name">
</label>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted)">Email
<input class="field" type="email" value="jakob.hoffmann@mail.com" readonly>
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted)">Password
<input class="field" type="password" value="passwordpassword" readonly>
</label>
</div>
<button class="btn-primary" onClick="{{authSubmit}}" style="margin-top: 32px; align-self: center">{{authCta}}</button>
<div style="display: flex; align-items: center; gap: 12px; margin-top: 32px; color: var(--muted); font-size: 12px">
<div style="flex-grow: 1; height: 1px; background: var(--line)"></div>or continue with<div style="flex-grow: 1; height: 1px; background: var(--line)"></div>
</div>
<div style="display: flex; gap: 12px; margin-top: 20px">
<button class="btn-ghost" onClick="{{authSubmit}}" style="flex: 1; text-transform: none; letter-spacing: 0; font-size: 14px">Google</button>
<button class="btn-ghost" onClick="{{authSubmit}}" style="flex: 1; text-transform: none; letter-spacing: 0; font-size: 14px">Apple</button>
</div>
<div style="flex-grow: 1"></div>
<p style="margin: 0; font-size: 13px; color: var(--muted); text-align: center">{{authSwitchText}} <button class="link" onClick="{{authSwitch}}">{{authSwitchCta}}</button></p>
</div>
</sc-if>

<!-- ============ INTRO TO ONBOARDING ============ -->
<sc-if value="{{isIntro}}" hint-placeholder-val="{{ false }}">
<div class="fade" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 72px 32px 56px">
<img src="assets/glow-1.webp" alt="" aria-hidden="true" style="position: absolute; left: -280px; bottom: -160px; width: 560px; opacity: 0.4; pointer-events: none">
<div style="position: relative; height: 64px; display: flex; align-items: center; isolation: isolate">
<div style="position: absolute; left: -6px; width: 64px; height: 64px; border-radius: 50%; background: #BDF288"></div>
<span style="position: relative; font-weight: 800; font-size: 34px; letter-spacing: -0.07em; color: #bdf288; mix-blend-mode: difference">AISpeak</span>
</div>
<div class="blobs" style="position: relative; width: 170px; height: 210px; margin-top: 56px">
<img src="assets/blob-b.webp" alt="" aria-hidden="true">
<img src="assets/blob-c.webp" alt="" aria-hidden="true">
<img src="assets/blob-a.webp" alt="" aria-hidden="true">
</div>
<h1 style="margin: 44px 0 0; font-size: 22px; font-weight: 700; text-align: center; line-height: 1.35">Nice to meet you, {{displayName}}! We want to get to know you better so we can help you achieve great results</h1>
<p style="margin: 14px 0 0; font-size: 14px; color: var(--muted); text-align: center">Please answer a few questions</p>
<div style="flex-grow: 1"></div>
<button class="btn-primary" onClick="{{startOnb}}">Let’s start</button>
</div>
</sc-if>

<!-- ============ ONBOARDING QUESTIONS ============ -->
<sc-if value="{{isOnb}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: 52px 24px 40px">
<img src="assets/glow-1.webp" alt="" aria-hidden="true" style="position: absolute; right: -300px; bottom: -220px; width: 560px; opacity: 0.35; pointer-events: none">
<div style="display: flex; align-items: center; gap: 12px; position: relative">
<button class="icon-btn" aria-label="Back" onClick="{{onbBack}}" style="margin-left: -10px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>
<div style="flex-grow: 1; display: flex; gap: 6px">
<sc-for list="{{progress}}" as="seg" hint-placeholder-count="5">
<div style="{{seg.style}}"></div>
</sc-for>
</div>
<span style="font-size: 12px; color: var(--muted); min-width: 28px; text-align: right">{{stepLabel}}</span>
</div>
<div class="fade" style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0; position: relative">
<h1 style="margin: 28px 0 0; font-size: 24px; font-weight: 700; line-height: 1.3">{{step.title}}</h1>
<p style="margin: 8px 0 0; font-size: 14px; color: var(--muted); line-height: 1.5">{{step.sub}}</p>
<div class="scroll" style="{{optWrapStyle}}">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
<button onClick="{{o.pick}}" style="{{o.style}}" aria-pressed="{{o.selected}}">
<span style="{{o.labelStyle}}">{{o.label}}</span>
<sc-if value="{{o.hasSub}}" hint-placeholder-val="{{ false }}"><span style="{{o.subStyle}}">{{o.sub}}</span></sc-if>
</button>
</sc-for>
</div>
</div>
<button class="btn-primary" onClick="{{onbNext}}" disabled="{{nextDisabled}}" style="align-self: center; margin-top: 20px; position: relative">{{nextLabel}}</button>
</div>
</sc-if>

<!-- ============ WELCOME ============ -->
<sc-if value="{{isWelcome}}" hint-placeholder-val="{{ false }}">
<div class="fade" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 72px 32px 56px">
<img src="assets/glow-1.webp" alt="" aria-hidden="true" style="position: absolute; right: -260px; bottom: -200px; width: 560px; opacity: 0.45; pointer-events: none">
<div style="position: relative; height: 64px; display: flex; align-items: center; isolation: isolate">
<div style="position: absolute; left: -6px; width: 64px; height: 64px; border-radius: 50%; background: #BDF288"></div>
<span style="position: relative; font-weight: 800; font-size: 34px; letter-spacing: -0.07em; color: #bdf288; mix-blend-mode: difference">AISpeak</span>
</div>
<div class="blobs" style="position: relative; width: 190px; height: 230px; margin-top: 64px">
<img src="assets/blob-a.webp" alt="" aria-hidden="true">
<img src="assets/blob-b.webp" alt="" aria-hidden="true">
<img src="assets/blob-c.webp" alt="" aria-hidden="true">
</div>
<h1 style="margin: 52px 0 0; font-size: 28px; font-weight: 700; text-align: center">{{welcomeText}}</h1>
<sc-if value="{{hasPlan}}" hint-placeholder-val="{{ false }}">
<p style="margin: 14px 0 0; font-size: 14px; color: var(--muted); text-align: center; line-height: 1.5">{{planText}}</p>
</sc-if>
<div style="flex-grow: 1"></div>
<button class="btn-primary" onClick="{{enterApp}}">Let’s start</button>
</div>
</sc-if>

<!-- ============ APP ============ -->
<sc-if value="{{isApp}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0">

<!-- ---------- HOME FEED ---------- -->
<sc-if value="{{isHomeFeed}}" hint-placeholder-val="{{ true }}">
<div class="scroll fade" style="position: absolute; inset: 0; padding: 52px 20px 120px">
<div style="display: flex; align-items: center; justify-content: space-between">
<p style="margin: 0; font-size: 14px; color: var(--muted)">Good afternoon, <span style="color: var(--text); font-weight: 700">{{displayName}}</span></p>
<div style="display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>28 days</div>
</div>
<h2 style="margin: 24px 0 12px; font-size: 19px; font-weight: 600; color: var(--accent-text); display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>lessons for today</h2>
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{lessons}}" as="c" hint-placeholder-count="2">
<div style="background: var(--card); border-radius: 18px; padding: 10px; position: relative">
<button class="card-btn" onClick="{{c.open}}">
<div style="border-radius: 12px; overflow: hidden; height: 128px"><img src="{{c.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></div>
<p style="margin: 10px 44px 4px 4px; font-size: 14px; font-weight: 600">{{c.title}}</p>
<p style="margin: 0 44px 2px 4px; font-size: 12px; color: var(--muted)">{{c.meta}}</p>
</button>
<button class="icon-btn" aria-label="{{c.bmLabel}}" onClick="{{c.bm}}" style="position: absolute; right: 4px; bottom: 4px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="{{c.bmFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
</button>
</div>
</sc-for>
</div>
<h2 style="margin: 28px 0 12px; font-size: 19px; font-weight: 600; color: var(--accent-text); display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg>list of phrases to learn</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{phrases}}" as="p" hint-placeholder-count="6">
<button onClick="{{p.open}}" style="{{p.style}}">
<span style="font-size: 12px; font-weight: 700; line-height: 1.2">{{p.title}}</span>
<span style="font-size: 10px; opacity: 0.85; margin-top: 2px">{{p.count}}</span>
</button>
</sc-for>
</div>
<h2 style="margin: 28px 0 12px; font-size: 19px; font-weight: 600; color: var(--accent-text); display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>recommended for you</h2>
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{recs}}" as="c" hint-placeholder-count="2">
<div style="background: var(--card); border-radius: 18px; padding: 10px; position: relative">
<button class="card-btn" onClick="{{c.open}}">
<div style="border-radius: 12px; overflow: hidden; height: 128px"><img src="{{c.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></div>
<p style="margin: 10px 44px 4px 4px; font-size: 14px; font-weight: 600">{{c.title}}</p>
<p style="margin: 0 44px 2px 4px; font-size: 12px; color: var(--muted)">{{c.meta}}</p>
</button>
<button class="icon-btn" aria-label="{{c.bmLabel}}" onClick="{{c.bm}}" style="position: absolute; right: 4px; bottom: 4px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="{{c.bmFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
</button>
</div>
</sc-for>
</div>
</div>
</sc-if>

<!-- ---------- ARTICLE ---------- -->
<sc-if value="{{isArticle}}" hint-placeholder-val="{{ false }}">
<div class="scroll fade" style="position: absolute; inset: 0; padding: 44px 20px 120px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button class="icon-btn" aria-label="Back to lessons" onClick="{{closeArticle}}" style="margin-left: -10px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>
<button onClick="{{toggleSpeak}}" aria-label="Listen to the article" aria-pressed="{{speaking}}" style="height: 40px; min-width: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: var(--card); color: var(--text); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600">
<sc-if value="{{speaking}}" hint-placeholder-val="{{ false }}"><span class="bars" style="display: flex; align-items: center; height: 18px"><span></span><span></span><span></span><span></span></span>Reading…</sc-if>
<sc-if value="{{notSpeaking}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></sc-if>
</button>
</div>
<h1 style="margin: 12px 0 0; font-size: 22px; font-weight: 700; line-height: 1.25">Architecture and Design: Crafting the Spaces We <button class="w" onClick="{{openInhabit}}" style="font-weight: 700; color: var(--accent-text)">Inhabit</button></h1>

function parseSegs(str, open) {
  var out = [], re = /\[([^\]|]+)(?:\|([^\]]+))?\]/g, last = 0, m;
  while ((m = re.exec(str))) {
    if (m.index > last) out.push({ text: str.slice(last, m.index), isWord: false, plain: true });
    var key = m[2] || m[1].toLowerCase();
    out.push({ text: m[1], isWord: true, plain: false, pick: open(key) });
    last = re.lastIndex;
  }
  if (last < str.length) out.push({ text: str.slice(last), isWord: false, plain: true });
  return out;
}

      var base, labelStyle, subStyle;
      var bg = sel ? LIME : CARD, fg = sel ? INK : TEXT, bd = sel ? LIME : 'rgba(189,242,136,0.35)';

        labelStyle = 'font-size: 15px; font-weight: 700';
        subStyle = 'font-size: 12px; opacity: 0.8';
      } else {
        base = 'min-height: 54px; border-radius: 16px; border: 1px solid ' + bd + '; background: ' + bg + '; color: ' + fg + '; font-size: 15px; font-weight: 700; flex-shrink: 0; transition: background .2s';
        labelStyle = ''; subStyle = '';
      }
      return { label: o.label, sub: o.sub || '', hasSub: !!o.sub, selected: sel, style: base, labelStyle: labelStyle, subStyle: subStyle,
        pick: function () {
          var a = Object.assign({}, self.state.answers), cur = a[step.key];
          if (step.multi) a[step.key] = cur.indexOf(o.id) >= 0 ? cur.filter(function (x) { return x !== o.id; }) : cur.concat([o.id]);
          else a[step.key] = o.id;
          self.setState({ answers: a });
        } };
    });
    var optWrapStyle = step.kind === 'wrap'
      ? 'margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; flex-grow: 1; min-height: 0'

    var answered = step.multi ? ans.length > 0 : !!ans;
    var progress = STEPS.map(function (_, i) {
      return { style: 'flex: 1; height: 4px; border-radius: 2px; transition: background .3s; background: ' + (i <= s.step ? LIME : 'var(--line)') };
    });
    var g = s.answers.goal;
    var planText = s.answers.level && g ? ('Your plan: ' + s.answers.level + ' · ' + GOAL_MIN[g] + ' minutes a day') : '';

    // ---------- home ----------
    var card = function (id, title, meta, img, open) {

    };
    var openArticle = function () { self.setState({ homeView: 'article', word: null, speaking: false }); };
    var demo = toast('Demo: open “Architecture and design” to try a lesson');
    var lessons = [
      card('arch', 'Architecture and design', 'Article · 5 min · 7 new words', IMG.arch, openArticle),

      card('interview', 'Job interview', 'AI role-play · 10 min', IMG.interview, function () { self.setState({ tab: 'ai', ai: 'intro' }); })

    var phrases = PH.map(function (p) {

        segs: parseSegs(p[1], openWord) };
    });
    var isSaved = function (label) { return s.saved.indexOf(label) >= 0; };

    });
    var w = null;
    if (s.word && WORDS[s.word]) {

        lang: de ? 'DE' : 'EN', trLabel: de ? 'Show English' : 'Translate to German',

      { title: 'Preparation for TOEFL', rating: '4.9', img: IMG.blobC, open: toast('TOEFL course — 62% complete') }

    var qz = QUIZ[Math.min(s.qi, QUIZ.length - 1)];
    var quizOpts = qz.opts.map(function (o, i) {
      var picked = s.qPick !== null, isC = i === qz.correct, isP = i === s.qPick;
      var bg = '#4B2FB5', fg = '#FFFFFF', bd = 'transparent', op = 1;

        pick: function () { if (self.state.qPick !== null) return; self.setState({ qPick: i, qScore: self.state.qScore + (isC ? 1 : 0) }); } };
    });
    var qRight = s.qPick === qz.correct;
    var vidWords = VID_WORDS.map(function (vw) {
      var on = isSaved(vw);
      return { label: vw, saved: on, pick: function () { toggleSaved(vw); },
        style: 'min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; color: ' + (on ? INK : TEXT) + '; background: ' + (on ? LIME : 'var(--chip)') + '; border: 0; font-weight: 600; transition: background .2s' };
    });

    // ---------- AI ----------
    var topicObj = TOPICS.filter(function (t) { return t.id === s.topic; })[0];
    var topics = TOPICS.map(function (t) {
      return { label: t.label, pick: function () {
        self.setState({ ai: 'chat', topic: t.id, msgs: [{ from: 'ai', text: self.fill(SCRIPTS[t.id][0]) }], pos: 1, recording: false, typing: false, chatDone: false });
      } };
    });
    var msgs = s.msgs.map(function (m) {
      var ai = m.from === 'ai';
      return { text: m.text,
        rowStyle: 'display: flex; justify-content: ' + (ai ? 'flex-start' : 'flex-end'),
        bubbleStyle: 'max-width: 80%; padding: 12px 14px; font-size: 14px; line-height: 1.5; border-radius: ' + (ai ? '18px 18px 18px 4px' : '18px 18px 4px 18px') + '; background: ' + (ai ? 'var(--card-a)' : 'rgba(189,242,136,0.18)') + '; border: 1px solid ' + (ai ? 'var(--chip)' : 'rgba(189,242,136,0.45)') + '; color: var(--text)' };
    });
    var mic = function () {
      var st = self.state;
      if (st.typing || st.chatDone) return;
      if (!st.recording) { self.setState({ recording: true }); return; }
      var script = SCRIPTS[st.topic];
      var userLine = self.fill(script[st.pos]);
      var next = st.pos + 1;
      self.setState({ recording: false, typing: true, msgs: st.msgs.concat([{ from: 'user', text: userLine }]), pos: next });
      self.later(function () {
        var cur = self.state;
        self.setState({ typing: false, msgs: cur.msgs.concat([{ from: 'ai', text: self.fill(script[next]) }]), pos: next + 1, chatDone: next + 1 >= script.length });
      }, 1300);
    };
    var statusText = s.recording ? 'Listening…' : (s.typing ? 'Typing…' : 'Online');
    var scores = [
      { label: 'Pronunciation', level: 'Advanced', img: IMG.blobA, bar: 'width: 86%; height: 100%; background: ' + LIME + '; border-radius: 3px' },
      { label: 'Vocabulary', level: 'Intermediate', img: IMG.blobB, bar: 'width: 58%; height: 100%; background: ' + LIME + '; border-radius: 3px' },
      { label: 'Grammar', level: 'Advanced', img: IMG.blobC, bar: 'width: 80%; height: 100%; background: ' + LIME + '; border-radius: 3px' }
    ];
    var summaryText = 'You kept the conversation flowing and answered every question in full sentences. Your intonation sounded natural and confident. To improve, watch the “th” sound in words like “think” and “three”, and try linking ideas with phrases such as “on top of that” or “that’s why”.';

    // ---------- profile ----------
    var WEEK = [['M', 40], ['T', 70], ['W', 55], ['T', 90], ['F', 35], ['S', 100], ['S', 65]];
    var week = WEEK.map(function (d, i) {
      return { day: d[0], style: 'flex: 1; border-radius: 4px; height: ' + d[1] + '%; background: ' + (i === 5 ? ACC_T : 'var(--bar-soft)') };
    });
    var favorites = [
      { title: 'Architecture and design', img: IMG.arch, open: function () { self.setState({ tab: 'home', homeView: 'article' }); } },
      { title: 'Rachel’s 1st Paycheck', img: IMG.rachel, open: function () { self.setState({ tab: 'discover', discView: 'video' }); } },
      { title: 'Videogames', img: IMG.games, open: demo }
    ];

    // ---------- nav ----------
    var navStyle = function (t) { return 'color: ' + (s.tab === t ? ACC_T : MUTED); };
    var goTab = function (t) { return function () { self.setState({ tab: t, word: null, homeView: t === 'home' && s.tab === 'home' ? 'feed' : self.state.homeView, discView: t === 'discover' && s.tab === 'discover' ? 'feed' : self.state.discView }); }; };

    var isApp = s.screen === 'app';
    var reg = s.authMode === 'register';
    return {
      isSplash: s.screen === 'splash', isAuth: s.screen === 'auth', isIntro: s.screen === 'intro', isOnb: s.screen === 'onb', isWelcome: s.screen === 'welcome', isApp: isApp,
      name: s.name, onName: function (e) { self.setState({ name: e.target.value }); }, displayName: name, initial: name.charAt(0).toUpperCase(),
      goSplash: set({ screen: 'splash' }),
      goRegister: set({ screen: 'auth', authMode: 'register' }),
      goSignin: set({ screen: 'auth', authMode: 'signin' }),
      isRegister: reg,
      authTitle: reg ? 'Create an account' : 'Welcome back',
      authCta: reg ? 'Register' : 'Sign In',
      authSwitchText: reg ? 'Already have an account?' : 'Don’t have an account?',
      authSwitchCta: reg ? 'Sign In' : 'Register',
      authSwitch: set({ authMode: reg ? 'signin' : 'register' }),
      authSubmit: reg ? set({ screen: 'intro' }) : set({ screen: 'welcome', returning: true }),
      startOnb: set({ screen: 'onb', step: 0 }),
      step: step, opts: opts, optWrapStyle: optWrapStyle, progress: progress, stepLabel: (s.step + 1) + '/' + STEPS.length,
      nextDisabled: !answered, nextLabel: s.step === STEPS.length - 1 ? 'Finish' : 'Next',
      onbNext: function () { if (!answered) return; if (s.step < STEPS.length - 1) self.setState({ step: s.step + 1 }); else self.setState({ screen: 'welcome', returning: false }); },
      onbBack: function () { if (s.step > 0) self.setState({ step: s.step - 1 }); else self.setState({ screen: 'intro' }); },
      welcomeText: s.returning ? 'Welcome back, ' + name : 'Welcome ' + name + '!',
      hasPlan: !s.returning && !!planText, planText: planText,
      enterApp: set({ screen: 'app', tab: 'home', homeView: 'feed' }),

      isHomeFeed: isApp && s.tab === 'home' && s.homeView === 'feed',
      isArticle: isApp && s.tab === 'home' && s.homeView === 'article',
      lessons: lessons, recs: recs, phrases: phrases,
      closeArticle: set({ homeView: 'feed', word: null, speaking: false }),
      openInhabit: openWord('inhabit'),
      speaking: s.speaking, notSpeaking: !s.speaking,
      toggleSpeak: function () { var on = !self.state.speaking; self.setState({ speaking: on }); if (on) self.later(function () { self.setState({ speaking: false }); }, 6000); },
      para: para, articleWords: articleWords,
      wordOpen: isApp && !!w, w: w || { ex: [] }, wordDe: s.wordDe,
      closeWord: set({ word: null }),
      toggleDe: function () { self.setState({ wordDe: !self.state.wordDe }); },
      toggleSaveWord: function () { if (s.word) toggleSaved(WORDS[s.word].head); },

      isDiscFeed: isApp && s.tab === 'discover' && s.discView === 'feed',
      isVideo: isApp && s.tab === 'discover' && s.discView === 'video',
      trending: trending, courses: courses,
      podcastToast: toast('Off Menu — new episode every Wednesday'),
      openVideo: set({ discView: 'video' }),
      closeVideo: set({ discView: 'feed', playing: false }),
      playing: s.playing, notPlaying: !s.playing, playLabel: s.playing ? 'Pause' : 'Play',
      togglePlay: function () { self.setState({ playing: !self.state.playing }); },
      progStyle: 'height: 100%; background: ' + LIME + '; border-radius: 2px; width: 24%; animation: prog 40s linear forwards; animation-play-state: ' + (s.playing ? 'running' : 'paused'),
      quiz: qz, quizOpts: quizOpts, quizActive: !s.qDone, quizFinished: s.qDone, quizScore: s.qScore,
      quizLabel: s.qDone ? 'Quiz' : 'Quiz ' + (s.qi + 1) + '/' + QUIZ.length,
      quizScoreLabel: 'Score ' + s.qScore,
      quizAnswered: s.qPick !== null,
      feedbackText: qRight ? 'Correct!' : 'Not quite — it’s “' + qz.opts[qz.correct] + '”',
      feedbackStyle: 'font-size: 13px; font-weight: 700; color: ' + (qRight ? ACC_T :'var(--danger)'),
      quizNextLabel: s.qi < QUIZ.length - 1 ? 'Next' : 'Finish',
      quizNext: function () { if (s.qi < QUIZ.length - 1) self.setState({ qi: s.qi + 1, qPick: null }); else self.setState({ qDone: true }); },
      quizRetry: set({ qi: 0, qPick: null, qScore: 0, qDone: false }),
      vidWords: vidWords,

      isAI: isApp && s.tab === 'ai',
      aiIntro: s.ai === 'intro', aiTopics: s.ai === 'topics', aiChat: s.ai === 'chat', aiDone: s.ai === 'done', aiSummary: s.ai === 'summary',
      aiStart: set({ ai: 'topics' }), aiBackIntro: set({ ai: 'intro' }), aiBackTopics: set({ ai: 'topics', recording: false, typing: false }),
      topics: topics, topicLabel: topicObj ? topicObj.label : '',
      chatRef: function (el) { self._chat = el; },
      msgs: msgs, typing: s.typing, recording: s.recording, notRecording: !s.recording,
      chatOpen: !s.chatDone, chatDone: s.chatDone,
      statusText: statusText, statusStyle: 'font-size: 12px; color: ' + (s.recording ? ACC_T : MUTED),
      micHint: s.recording ? 'Speak now — tap again when you’re done' : (s.typing ? '' : 'Tap the mic and answer out loud'),
      micLabel: s.recording ? 'Stop recording and send' : 'Start speaking',
      micClass: s.recording ? 'mic-on' : '',
      micStyle: 'width: 76px; height: 76px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; color: ' + INK + '; background: ' + LIME + '; transition: transform .2s, opacity .2s; box-shadow: 0 0 0 8px rgba(189,242,136,0.15); opacity: ' + (s.typing ? 0.45 : 1),
      mic: mic,
      typeToast: toast('Keyboard mode — coming soon'), settingsToast: toast('Settings: speed, accent, difficulty'),
      aiToDone: set({ ai: 'done' }), aiToSummary: set({ ai: 'summary' }),
      aiFinish: function () { self.setState({ ai: 'intro', msgs: [], chatDone: false }); self.showToast('Great job! +1 lesson done'); },
      scores: scores, summaryText: summaryText,

      isProfile: isApp && s.tab === 'profile',
      phrasesLearned: 350 + s.saved.length - 5,
      week: week, favorites: favorites,
      savedWords: s.saved.map(function (x) { return { label: x }; }), savedCount: s.saved.length,
      dark: s.dark, toggleDark: function () { var d = !self.state.dark; self.setState({ dark: d }); self.showToast(d ? 'Dark mode on' : 'Light mode on'); },
      rootClass: s.dark ? 'ais' : 'ais light',
      themeIcon: s.dark ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: function () { self.setState({ dark: !self.state.dark }); },
      isDarkTheme: s.dark, isLightTheme: !s.dark,
      switchTrack: 'width: 44px; height: 26px; border-radius: 13px; position: relative; transition: background .2s; background: ' + (s.dark ? LIME : 'var(--line-strong)'),
      switchKnob: 'position: absolute; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: ' + INK + '; transition: left .2s; left: ' + (s.dark ? '21px' : '3px'),
      editToast: toast('Edit profile — coming soon'), faqToast: toast('FAQ — coming soon'), aboutToast: toast('AISpeak · portfolio prototype'),
      logout: set({ screen: 'splash', tab: 'home', homeView: 'feed', ai: 'intro', discView: 'feed' }),

      showNav: isApp,
      tabHome: goTab('home'), tabDiscover: goTab('discover'), tabAI: goTab('ai'), tabProfile: goTab('profile'),
      navHome: navStyle('home'), navDiscover: navStyle('discover'), navAI: navStyle('ai'), navProfile: navStyle('profile'),
      curHome: s.tab === 'home' ? 'page' : 'false', curDiscover: s.tab === 'discover' ? 'page' : 'false', curAI: s.tab === 'ai' ? 'page' : 'false', curProfile: s.tab === 'profile' ? 'page' : 'false',

      toastOn: !!s.toast, toast: s.toast || ''
    };
  }
}

</script>
<script>
(function () {
  var phone = document.getElementById('phone');
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    var mobile = w < 500 || (w <= 420 && h <= 900);
    document.body.classList.toggle('fit-mobile', mobile);
    var s = mobile ? Math.min(w / 390, h / 844) : Math.min(1, (w - 32) / 390, (h - 32) / 844);
    phone.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();
  mountDC(Component, document.getElementById('dc-tpl'), phone, {});
})();
</script>
